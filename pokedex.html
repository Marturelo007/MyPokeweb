<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MB.Pokedex</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/FullPokeball.png" />
    <script src="./pokemon.js" defer></script>
    <script src="./search.js" defer></script>
    <script
      src="https://kit.fontawesome.com/bdf06eb8e9.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body id="body">
    <main class="main">
      <header class="header home">
        <div class="container">
          <div class="logowrapper">
            <input id="checkbox" type="checkbox">
            <label class="toggle" for="checkbox">
                <div id="bar1" class="bars"></div>
                <div id="bar2" class="bars"></div>
                <div id="bar3" class="bars"></div>
            </label>
            <a href="/index/index.html" class="myImageA"><img id="myImage" src="../assets/EmptyPokeball.png" alt="Hover Image" class="myImage" width="100%" height="100%"></a>              
            <div class="navbar-container">

                  <a href="/pokedex.html"><button class="navbar">Pokedex</button></a>
                  <a href="/error.html"><button class="navbar">Items</button></a>
                  <a href="/error.html"><button class="navbar">Combat guide</button></a>
                  <br>
                  <div class="sectionButton">
                  <button id="section1Button" class="navbar">Kanto</button>
                  <button id="section2Button" class="navbar">Johto</button>
                  <button id="section3Button" class="navbar">Hoenn</button>
                  <button id="section4Button" class="navbar">Sinnoh</button>
                  <button id="section5Button" class="navbar">Teselia</button>
                  <button id="section6Button" class="navbar">Kalos</button>
                  <button id="section7Button"class="navbar">Alola</button>
                  <button id="section8Button"class="navbar">Galar</button>
                  <button id="section9Button"class="navbar">Paldea</button>
                </div>

                  <select id="sectionSelect" class="navbar">
  <option value="1-151">Kanto</option>
  <option value="152-251">Johto</option>
  <option value="252-386">Hoenn</option>
  <option value="387-494">Sinnoh</option>
  <option value="495-649">Teselia</option>
  <option value="650-721">Kalos</option>
  <option value="722-809">Alola</option>
  <option value="810-905">Galar</option>
  <option value="906-1025">Paldea</option>
</select>

                  <!-- <a href="error.html"><button class="navbar">Pokemon showdown</button></a> -->
              </div>

                <select id="sectionSelect" class="navbar">
<option value="1-151">Kanto</option>
<option value="152-251">Johto</option>
<option value="252-386">Hoenn</option>
<option value="387-494">Sinnoh</option>
<option value="495-649">Teselia</option>
<option value="650-721">Kalos</option>
<option value="722-809">Alola</option>
<option value="810-905">Galar</option>
<option value="906-1025">Paldea</option>
</select>

                <!-- <a href="error.html"><button class="navbar">Pokemon showdown</button></a> -->
            </div>
            


            <!-- hacer el clasificador por tipo de pokemon y por region Aplicar el ESC,-->
          </div>
          
          <div class="search-wrapper">
            <div class="search-wrap">
              <img
                src="./assets/search.svg"
                alt="search icon"
                class="search-icon"
              />
              <input
                type="text"
                class="search-input body3-fonts"
                placeholder="Search"
                id="search-input"
              />
              <img
                src="./assets/cross.svg"
                alt="cross icon"
                class="search-close-icon"
                id="search-close-icon"
              />
            </div>
            <div class="sort-wrapper">
              <div class="sort-wrap">
                <img
                  src="./assets/sorting.svg"
                  alt="sorting"
                  class="sort-icon"
                  id="sort-icon"
                />
              </div>
              <div class="filter-wrapper">
                <p class="body2-fonts">Sort by:</p>
                <div class="filter-wrap">
                  <div>
                    <input
                      type="radio"
                      id="number"
                      name="filters"
                      value="number"
                      checked
                    />
                    <label for="number" class="body3-fonts">Name</label>
                  </div>
                  <div>
                    <input type="radio" id="name" name="filters" value="name" />
                    <label for="name" class="body3-fonts">Number</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="toggle-switch">
              <label class="switch-label">
                <input type="checkbox" class="checkbox">
                <span class="slider"></span>
              </label>
            </div>  
          </div>
        </div>
      </header>
      <section class="pokemon-list">
        <div class="container">
          <div class="list-wrapper"></div>
        </div>
        <div id="not-found-message">Pokemon not found</div>
      </section>
    </main>
  </body>
</html>
