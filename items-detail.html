<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>items Detail</title>
    <link rel="stylesheet" href="itemsStyle.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/FullPokeball.png" />
  </head>
  <body>
    <main class="detail-main main">
      <header class="header">
        <div class="header-wrapper">  
          <a href="./items.html" class="back-btn-wrap">
            <img
              src="./assets/back-to-home.svg"
              alt="back to home"
              class="back-btn"
              id="back-btn"
            />
          </a>
          <div class="header-wrap">
            <div class="name-wrap">
              <h1 class="name"></h1>
            </div>
          </div>
          <div class="Item-id-wrap" font="20px">
            <p class="body2-fonts"></p>
          </div>
        </div>
      </header>
      <div class="featured-img">
        <a href="#" class="arrow left-arrow" id="leftArrow">
          <img src="./assets/chevron_left.svg" alt="back" />
        </a>
        <div class="detail-img-wrapper">
          <img id="normalImage" src="" alt="Normal Sprite" />
        </div>

        <a href="#" class="arrow right-arrow" id="rightArrow">
          <img src="./assets/chevron_right.svg" alt="forward" />
        </a>
      </div>
      <div class="detail-card-detail-wrapper">        
        <div class="power-wrapper">
          <p class="body3-fonts type grass"></p>
          <p class="body3-fonts type poison"></p>
        </div>
        <p class="body2-fonts about-text">About</p>
          <div class="Item-detail-wrap">
            <div class="Item-detail">
              <p class="body3-fonts height"></p>
            </div>
            <p class="caption-fonts">Height</p>
          </div>
        </div>
        <p class="body3-fonts Item-description"></p>
      </div>
      <img src="./assets/pokeballDetail.svg" alt="pokedex" class="detail-bg" />
    </main>
     <script src="/items-details.js" defer></script>
  </body>
</html>
